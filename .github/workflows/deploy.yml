name: Deploy

# CI + continuous deployment to the 14Labs VPS.
# Every push to master (and every PR) runs the test suite against Postgres +
# Redis. Only if the tests pass — and only on a push to master — do we SSH into
# the server and redeploy the kharchay service (pull latest code, rebuild). The
# web container runs `manage.py migrate` on start, so no separate migrate step.
#
# Requires these repo secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST     the VPS public IPv4 address (hosted runners are IPv4-only)
#   VPS_PORT     SSH port (2222)
#   VPS_USER     deploy user with docker access + ACL on /opt/services/kharchay
#   VPS_SSH_KEY  private key whose public half is in the deploy user's authorized_keys
# See /opt/services/kharchay/DEPLOY.md in the 14labs-infra repo for setup.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kharchay
          POSTGRES_PASSWORD: kharchay
          POSTGRES_DB: kharchay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kharchay"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # CI-only values. DEBUG=True keeps the prod-only hardening branch off and
      # uses the local-memory cache (matches how the suite runs locally).
      SECRET_KEY: ci-only-secret-not-used-in-production-0123456789abcdef
      DATABASE_URL: postgres://kharchay:kharchay@localhost:5432/kharchay_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_TASK_ALWAYS_EAGER: "True"
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/services/kharchay
            git -C src fetch --prune origin
            git -C src reset --hard origin/master
            docker compose up -d --build web celery-worker
            docker image prune -f
            # Wait for the API to report healthy
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8020/api/health/ >/dev/null; then
                echo "kharchay: healthy"; exit 0
              fi
              sleep 5
            done
            echo "kharchay: API did not become healthy after deploy" >&2
            docker compose logs --tail 50 web >&2
            exit 1
